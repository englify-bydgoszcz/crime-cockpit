name: Deploy Crime Cockpit to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build code-only Pages artifact
        run: |
          rm -rf dist
          mkdir -p dist

          if [ -f site.zip ]; then
            unzip -q site.zip -d dist
          fi

          cp index.html dist/index.html
          cp app.js dist/app.js

          if [ -f styles.css ]; then cp styles.css dist/styles.css; fi
          if [ -f demo-data.js ]; then cp demo-data.js dist/demo-data.js; fi

          # Private portraits/media remain excluded. Generated owner-safe location visuals are a compiled frontend asset.
          rm -rf dist/assets
          if [ -d assets/locations ]; then
            mkdir -p dist/assets
            cp -R assets/locations dist/assets/locations
          fi
          rm -rf dist/apps-script
          rm -f dist/site.zip
          touch dist/.nojekyll

          test -f dist/index.html
          test -f dist/app.js
          test -f dist/styles.css
          test -f dist/demo-data.js
          test -f dist/assets/locations/bk00002/LOC-0003__Saxby_on_Avon.png
          test -f dist/assets/locations/bk00002/LOC-0025__Carlottas.png

      - name: Frontend regression smoke
        run: node scripts/frontend-smoke.cjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
