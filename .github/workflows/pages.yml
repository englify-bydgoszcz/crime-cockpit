name: Deploy Crime Cockpit to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build minimal reader-only Pages artifact
        run: |
          rm -rf dist
          mkdir -p dist
          cp index.html dist/index.html
          cp lite.js dist/lite.js
          cp lite.css dist/lite.css
          touch dist/.nojekyll
          test -f dist/index.html
          test -f dist/lite.js
          test -f dist/lite.css
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 4

      - name: Reader frontend smoke
        run: node scripts/lite-smoke.cjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
